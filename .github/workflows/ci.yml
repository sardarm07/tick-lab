name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    # x64, like the machine the project is developed on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24" # the same as [tool.uv] required-version in pyproject.toml
      - run: make ci

# The markets Tick Lab follows.
#
# A feed is one market on one exchange. Each feed gets its own partition of the
# `trades` topic, so every partition is one ordered log with one watermark.
# A feed's partition number must never change once data has been written.
#
# symbol: BASE/QUOTE, the same spelling on every exchange.
# native: the exchange's own name for the market.
# silence_s: seconds without a trade before the feed counts as silent: twice the longest gap
#   between trades in a week of history, rounded up to 15 s (docs/data-study.md).

[[feeds]]
exchange = "BINANCE"
symbol = "BTC/USDT"
native = "BTCUSDT"
partition = 0
silence_s = 30

[[feeds]]
exchange = "BINANCE"
symbol = "ETH/USDT"
native = "ETHUSDT"
partition = 1
silence_s = 75

[[feeds]]
exchange = "BINANCE"
symbol = "SOL/USDT"
native = "SOLUSDT"
partition = 2
silence_s = 45

# Kraken: USD pairs, plus USDT/USD to convert their prices to USDT. The WebSocket and the REST
# API (with assetVersion=1) both use these names. Silence thresholds by the same rule, from a
# week of Kraken history (docs/data-study.md).

[[feeds]]
exchange = "KRAKEN"
symbol = "BTC/USD"
native = "BTC/USD"
partition = 3
silence_s = 105

[[feeds]]
exchange = "KRAKEN"
symbol = "ETH/USD"
native = "ETH/USD"
partition = 4
silence_s = 135

[[feeds]]
exchange = "KRAKEN"
symbol = "SOL/USD"
native = "SOL/USD"
partition = 5
silence_s = 135

[[feeds]]
exchange = "KRAKEN"
symbol = "USDT/USD"
native = "USDT/USD"
partition = 6
silence_s = 210

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: producer-binance
    static_configs:
      - targets: ["producer-binance:8000"]

  - job_name: reconciler
    static_configs:
      - targets: ["reconciler:8000"]

  - job_name: flink
    static_configs:
      - targets: ["flink-jobmanager:9249", "flink-taskmanager:9249"]

  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

  - job_name: clickhouse
    static_configs:
      - targets: ["clickhouse:9363"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
